{% extends 'base.html' %}
{% block title %}Удаление записи{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление записи</h1>

<p>Вы уверены, что хотите удалить запись <strong>«{{ object.title }}»</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a href="{% url 'post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
