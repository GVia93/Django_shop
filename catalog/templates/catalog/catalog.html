{% extends 'base.html' %}
{% block title %}Каталог{% endblock %}
{% block content %}
<h1 class="mb-4">Категории</h1>

<ul class="list-group">
  {% for cat in categories %}
    <li class="list-group-item">
      <a href="{% url 'catalog:category_products' cat.id %}">{{ cat.name }}</a>
    </li>
  {% empty %}
    <li class="list-group-item">Нет доступных категорий.</li>
  {% endfor %}
</ul>
{% endblock %}
