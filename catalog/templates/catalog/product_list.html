{% extends 'base.html' %}
{% block title %}Список продуктов{% endblock %}

{% block content %}
<h1>Список продуктов</h1>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Наименование</th>
            <th>Категория</th>
            <th>Цена</th>
        </tr>
    </thead>
    <tbody>
        {% for product in object_list %}
        <tr>
            <td>
                <a href="{% url 'catalog:product_detail' product.pk %}" class="text-primary text-decoration-none">
                    {{ product.name }}
                </a>
            </td>
            <td>{{ product.category }}</td>
            <td>{{ product.price }}</td>
            <td>
                <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-sm btn-warning">Редактировать</a>
            </td>
            <td>
                <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-sm btn-warning">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
